<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라운지엑스 경영관리 루프</title>
<meta name="description" content="목표수립 → 사업현황·분석 → 전략과제 → 실행관리·지표리뷰">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- v 값을 올리면 브라우저가 캐시를 버리고 새로 받습니다. 파일을 고칠 때마다 날짜를 바꾸십시오. -->
<link rel="stylesheet" href="ledger.css?v=20260923e">
</head>
<body>

<script>
/* 스크립트가 하나라도 죽으면 빈 화면 대신 원인을 보여 줍니다. */
window.__LXERR = [];
window.addEventListener("error", function (e) {
  window.__LXERR.push((e.filename || "").split("/").pop() + " : " + (e.message || e.type));
}, true);
</script>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <a class="brand" href="#/goal">
    <span class="brand-mark">LX</span>
    <span class="brand-title">경영관리 루프</span>
  </a>
  <nav class="mainnav" id="mainNav"></nav>
  <span class="brand-sub" id="asofChip"></span>
</header>

<div class="shell">
  <aside class="side" id="side">
    <nav id="sideNav"></nav>
    <div class="side-foot"><p id="sideMeta"></p></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="page-head">
      <div class="crumb" id="crumb"></div>
      <h1 id="pageTitle"></h1>
      <p class="page-sub" id="pageSub"></p>
    </div>
    <div id="pageBody"></div>
    <nav class="pager" id="pager"></nav>
  </main>
</div>

<div class="drill-layer" id="drillLayer" hidden>
  <div class="drill-box" role="dialog" aria-modal="true">
    <button class="drill-x" id="drillX" aria-label="닫기">✕</button>
    <div id="drillBody"></div>
  </div>
</div>

<noscript>
  <div style="padding:30px;max-width:640px;margin:0 auto">
    <h2>자바스크립트가 꺼져 있습니다</h2>
    <p>이 페이지는 자바스크립트로 표를 그립니다. 브라우저 설정에서 자바스크립트를 허용해 주십시오.</p>
  </div>
</noscript>

<script src="data.js?v=20260923e"></script>
<script src="data2.js?v=20260923e"></script>
<script src="ledger.js?v=20260923e"></script>

<script>
/* 렌더가 안 됐으면 원인을 화면에 띄웁니다. 빈 화면으로 끝나지 않게. */
setTimeout(function () {
  var nav = document.getElementById("sideNav");
  if (nav && nav.children.length) return;
  var box = document.getElementById("pageBody");
  var t = document.getElementById("pageTitle");
  if (t) t.textContent = "화면을 그리지 못했습니다";
  var why = [];
  if (typeof LX === "undefined") why.push("data.js 가 로드되지 않았습니다 (LX 없음)");
  else {
    if (!LX.drill)     why.push("data2.js 가 로드되지 않았습니다 (LX.drill 없음)");
    if (!LX.segDetail) why.push("data2.js 가 로드되지 않았습니다 (LX.segDetail 없음)");
  }
  if (window.__LXERR && window.__LXERR.length)
    why.push("스크립트 오류 — " + window.__LXERR.join(" / "));
  if (!why.length) why.push("원인을 특정하지 못했습니다. 브라우저 콘솔(F12)을 확인해 주십시오.");
  if (box) {
    box.innerHTML =
      '<div class="banner b-red"><b>원인</b><ul style="margin:6px 0 0"><li>' +
      why.join("</li><li>") + "</li></ul>" +
      '<p style="margin:12px 0 0"><b>가장 흔한 원인은 브라우저 캐시입니다.</b> ' +
      "Windows는 <code>Ctrl+Shift+R</code>, Mac은 <code>Cmd+Shift+R</code> 로 강력 새로고침해 보십시오. " +
      "그래도 같으면 저장소에 data.js · data2.js · ledger.js · ledger.css 네 파일이 모두 올라가 있는지 확인해 주십시오.</p></div>";
  }
}, 1200);
</script>
</body>
</html>
