<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라운지엑스 관리회계 포털</title>
<meta name="description" content="라운지엑스 관리회계대장 — 사업 구조, 목표 대비 실적, 적자의 원인, 개선과제">
<link rel="stylesheet" href="ledger.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
    <a class="brand" href="#/overview">
      <span class="brand-mark">LX</span>
      <span class="brand-text">라운지엑스 <b>관리회계 포털</b></span>
    </a>
    <div class="topbar-right">
      <span class="asof-chip" id="asofChip"></span>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side" id="side">
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <p id="sideMeta"></p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="page-head">
      <div class="crumb" id="crumb"></div>
      <h1 id="pageTitle"></h1>
      <p class="page-sub" id="pageSub"></p>
    </div>
    <div id="pageBody"></div>
    <nav class="pager" id="pager"></nav>
  </main>
</div>

<div class="drill-layer" id="drillLayer" hidden>
  <div class="drill-box" role="dialog" aria-modal="true">
    <button class="drill-x" id="drillX" aria-label="닫기">✕</button>
    <div id="drillBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="ledger.js"></script>
</body>
</html>
